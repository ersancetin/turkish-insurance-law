# =============================================================================
# Türk Sigorta Hukuku Kaynak Kütüğü (Source Registry)
# -----------------------------------------------------------------------------
# Bu dosya deponun TEK GERÇEK KAYNAĞIDIR (single source of truth).
# belgeler/ altındaki tüm .md iskeletleri, INDEX.md ve meta/durum-raporu.md
# bu dosyadan `scripts/uret.py` ile üretilir. Elle .md düzenlemek yerine
# önce buraya kayıt ekleyin, sonra üretici betiği çalıştırın.
#
# Alanlar:
#   id             : benzersiz, kebab-case kimlik (dosya adı temeli)
#   baslik         : belgenin resmî tam adı
#   tur            : kanun | cbk | yonetmelik | teblig | genel-sart | genelge |
#                    sektor-duyurusu | bildirge | rehber | tarife | karar | kurum
#   klasor         : depo içindeki hedef klasör
#   brans          : sigorta branşı etiketleri
#   otorite        : belgeyi çıkaran merci
#   numara         : kanun/genelge/karar numarası (varsa)
#   rg_tarihi      : Resmî Gazete tarihi (YYYY-AA-GG) — DOĞRULANMAMIŞ olabilir
#   rg_sayisi      : Resmî Gazete sayısı — DOĞRULANMAMIŞ olabilir
#   durum          : yururlukte | mulga | kismen-iptal | degisiklik-bekliyor | bilinmiyor
#   oncelik        : 1 (kritik) .. 3 (tamamlayıcı)  — toplama sırası
#   kaynaklar      : resmî/birincil erişim adresleri (indeks sayfası olabilir)
#   etiketler      : serbest arama etiketleri
#   ozet           : tek cümlelik kapsam açıklaması
# =============================================================================

surum: "0.1.0"
guncelleme: "2026-08-19"
dogrulama_notu: >-
  Bu kütükteki kayıtların bir bölümünün (öncelikli kanun, CBK, tahkim yönetmeliği
  ve öncelikli genel şartlar) Resmî Gazete tarih/sayı bilgileri 19/08/2026'da
  resmî kaynaklardan (resmigazete.gov.tr, mevzuat.gov.tr, SEDDK) çevrimiçi
  DOĞRULANMIŞTIR; bu kayıtlarda `dogrulama.durum: dogrulandi`. Geri kalan
  kayıtların künye bilgileri henüz doğrulanmamıştır (`dogrulanmadi`) veya boş
  bırakılmıştır; resmî metin çekilirken teyit edilmelidir. Doğrulanmış kayıtların
  listesi için bkz. `meta/durum-raporu.md`.

portallar:
  seddk_mevzuat: "https://www.seddk.gov.tr/tr/mevzuat"
  seddk_yonetmelikler: "https://www.seddk.gov.tr/tr/mevzuat/sigortacilik/yonetmelikler"
  seddk_bes_genelge: "https://www.seddk.gov.tr/tr/mevzuat/bireysel-emeklilik/genelge-teblig-ve-sektor-duyurulari"
  seddk_duyurular: "https://www.seddk.gov.tr/tr/duyurular"
  seddk_mevzuat_duyurulari: "https://www.seddk.gov.tr/tr/duyurular/mevzuat-duyurulari"
  mevzuat_gov: "https://www.mevzuat.gov.tr"
  resmi_gazete: "https://www.resmigazete.gov.tr"
  tsb_genel_sartlar: "https://www.tsb.org.tr/tr/mevzuat/sigortacilik/genel-sartlar"
  sigorta_tahkim: "https://www.sigortatahkim.org"
  anayasa_mahkemesi: "https://normkararlarbilgibankasi.anayasa.gov.tr"
  yargitay_karar_arama: "https://karararama.yargitay.gov.tr"
  danistay_karar_arama: "https://karararama.danistay.gov.tr"
  dask: "https://dask.gov.tr"
  tarsim: "https://www.tarsim.gov.tr"
