# ---------------------------------------------------------------------------
# 05 — GENEL ŞARTLAR
# Not: Genel şartlar iki gruba ayrılır:
#  (a) Resmî Gazete'de SAYI ile yayımlananlar — genellikle zorunlu sorumluluk
#      branşları (ZMSS trafik 29355, tıbbi kötü uygulama 27648, özel güvenlik 25739,
#      zorunlu deprem/DASK 27933 vb.). Bunlarda rg_tarihi/rg_sayisi doldurulur.
#  (b) Resmî Gazete'de sayı ile YAYIMLANMAYANLAR — Hazine/SEDDK veya (tarım için)
#      TARSİM tarafından doğrudan çıkarılıp çoğu yıllık güncellenenler (kasko,
#      sağlık, hayat, yangın, ferdi kaza, tüm devlet destekli tarım genel şartları).
#      Bunlarda rg alanı BOŞ bırakılır; yürürlük/güncelleme bilgisi özete yazılır.
#  UYARI (a grubu): Eski zorunlu sorumluluk branşlarında (koltuk ferdi kaza,
#      karayolu taşımacılık, tüpgaz, tehlikeli maddeler, deniz araçları, asansör,
#      maden) Genel Şartların KENDİ RG'si; onu zorunlu kılan Bakanlar Kurulu Kararı
#      ve Tarife/Talimat Tebliği RG'lerinden FARKLIDIR ve çevrimiçi aramalar bunları
