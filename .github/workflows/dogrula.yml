name: Depo denetimi

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  dogrula:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıklar
        run: pip install pyyaml

      - name: Kütükte olup dosyası olmayan kayıt var mı
        run: python3 scripts/uret.py --kontrol

      - name: Künye ve şema denetimi
        run: python3 scripts/dogrula.py

      - name: Üretilen dosyalar güncel mi
        run: |
          python3 scripts/uret.py
          if ! git diff --quiet -- INDEX.md data/kaynaklar.json meta/durum-raporu.md; then
            echo "::error::INDEX.md / kaynaklar.json / durum-raporu.md güncel değil."
            echo "Çözüm: python3 scripts/uret.py çalıştırıp sonucu commit edin."
            git --no-pager diff -- INDEX.md data/kaynaklar.json meta/durum-raporu.md
            exit 1
          fi
